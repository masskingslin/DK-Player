name: Build & Sign Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore dkplayer-release.jks \
            -alias "King7777" \
            -keypass "King7777" \
            -storepass "King7777" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DKPlayer, OU=TV, O=DK, L=Tirunelveli, ST=TamilNadu, C=IN"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Signed Release APK & Bundle
        env:
          RELEASE_STORE_FILE: ../dkplayer-release.jks
          RELEASE_STORE_PASSWORD: "King7777"
          RELEASE_KEY_ALIAS: "King7777"
          RELEASE_KEY_PASSWORD: "King7777"
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DK-Player-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: DK-Player-Release-Bundle
          path: app/build/outputs/bundle/release/*.aab
