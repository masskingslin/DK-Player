name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      minify:
        description: 'Enable R8 shrinking (turn OFF to test a release-only crash)'
        type: boolean
        default: true

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DK_MINIFY: ${{ inputs.minify }}
      # Optional. Add these 4 repository secrets (Settings -> Secrets and variables ->
      # Actions) to sign with your own key. Without them the APK is debug-signed.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      DK_KEYSTORE_PASSWORD: ${{ secrets.DK_KEYSTORE_PASSWORD }}
      DK_KEY_ALIAS: ${{ secrets.DK_KEY_ALIAS }}
      DK_KEY_PASSWORD: ${{ secrets.DK_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Decode release keystore (if configured)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dk-release.jks"
            echo "DK_KEYSTORE_FILE=$RUNNER_TEMP/dk-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found - APK will be signed with your key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret - APK will be signed with the temporary debug key."
          fi

      - name: Generate Wrapper & Build Release APK
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 9.4.1
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # On failure: put just the compiler/Gradle errors at the top of the run summary so
      # they can be copied from a phone without scrolling the whole log.
      - name: Summarise build errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|FAILURE" -A4 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -5
          done

      - name: Check 16 KB page-size compatibility
        run: python3 tools/check_16kb.py app/build/outputs/apk/release/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DK-Player-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload R8 mapping + Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: DK-Player-Build-Info
          path: |
            app/build/outputs/mapping/release/
            app/schemas/
          if-no-files-found: ignore

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Direct APK download link on the repo's Releases page (works from a phone browser).
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DK Player (latest build)
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
